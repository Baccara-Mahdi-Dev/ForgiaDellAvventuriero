<div class="weapon-base-backdrop" (click)="cancelled.emit()">
  <section class="weapon-base-dialog" role="dialog" aria-modal="true" aria-labelledby="weapon-base-title"
    (click)="$event.stopPropagation()">
    <header>
      <div>
        <p class="kicker">Configura arma magica</p>
        <h2 id="weapon-base-title">Scegli la forma di {{ item.name }}</h2>
        <p>Statistiche, proprietà e competenza verranno ereditate dall’arma scelta.</p>
      </div>
      <button aria-label="Chiudi" (click)="cancelled.emit()">×</button>
    </header>

    <label class="weapon-base-search">
      <span>Cerca un’arma</span>
      <input type="search" placeholder="Es. spada lunga, stocco…" [ngModel]="search()"
        (ngModelChange)="search.set($event)" />
    </label>

    <div class="weapon-base-grid">
      @for (option of filteredOptions; track option.id) {
      <button [class.selected]="selectedId === option.id" (click)="selected.emit(option.id)">
        <strong>{{ option.name }}</strong>
        <span>{{ option.damage }} {{ option.damageType }}</span>
        <small>{{ option.group }} · {{ option.properties?.join(', ') || 'Nessuna proprietà' }}</small>
      </button>
      } @empty {
      <p>Nessuna arma corrisponde alla ricerca.</p>
      }
    </div>
  </section>
</div>
